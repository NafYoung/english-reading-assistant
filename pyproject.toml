[project]
name = "era"
version = "0.1.0"
description = "Reading Coach Agent — 目标语料驱动的英语阅读教练"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "YOUNG NAF" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openai>=1.50",
    "pydantic>=2.9",
    "trafilatura>=2.0",
    "pdfminer.six>=20240706",
    "simplemma>=1.1",
    "fsrs>=6.3.2",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
era = "era.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
era = [
    "migrations/*.sql",
    "web/templates/*.html",
    "web/static/*",
    "llm/prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
